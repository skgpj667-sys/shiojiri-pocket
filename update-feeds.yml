name: Update Shiojiri Feeds Automatically

on:
  schedule:
    # Run every 2 hours automatically
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub web UI

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch Latest Feeds & Build Static Files
        run: |
          python build_static.py

      - name: Commit and Push Updated Feeds
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Shiojiri feeds [$(date '+%Y-%m-%d %H:%M')]" && git push)
